name: Release Obsidian plugin

on:
  push:
    tags:
      # только версионные теги (1.9.1), но НЕ тег `dict` с ассетами словаря
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # сборки нет: main.js лежит в репозитории и правится напрямую
      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # если релиз уже создан вручную — не падаем, а до-заливаем ассеты (с provenance)
          gh release create "$tag" \
            --title="$tag" \
            --notes="Russian Rhymes $tag. See README for details." \
            main.js manifest.json styles.css \
            || gh release upload "$tag" main.js manifest.json styles.css --clobber
