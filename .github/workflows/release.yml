name: Release Obsidian plugin

on:
  push:
    tags:
      # только версионные теги (2.1.0), но НЕ тег `dict` с ассетами словаря
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # main.js в репозитории тоже лежит, но релиз собирается из исходников:
      # так опубликованный файл заведомо соответствует src/, а не чьей-то забытой правке
      - name: Build
        run: npm run build

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- main.js; then
            echo "main.js в репозитории не совпадает со сборкой из src/."
            echo "Соберите локально (npm run build) и закоммитьте результат."
            git --no-pager diff --stat -- main.js
            exit 1
          fi

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # если релиз уже создан вручную — не падаем, а до-заливаем ассеты (с provenance)
          gh release create "$tag" \
            --title="$tag" \
            --notes="Russian Rhymes $tag. See README for details." \
            main.js manifest.json styles.css \
            || gh release upload "$tag" main.js manifest.json styles.css --clobber
